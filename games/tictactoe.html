<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tic Tac Toe</title>
  <style>
    html,body{height:100%;margin:0;background:#090b0f;color:#e8f5ff;font-family:Inter,Arial}
    .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
    .board{display:grid;grid-template-columns:repeat(3,100px);gap:8px;margin:12px}
    .cell{width:100px;height:100px;background:#0f1318;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:42px;cursor:pointer}
    .meta{color:#9fb8d9}
    button{margin-top:10px;padding:8px 12px;border-radius:8px;border:none;background:#8ab4f8;color:#021223;cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="meta">Tic Tac Toe — click a cell to play. X starts.</div>
    <div id="board" class="board"></div>
    <button onclick="reset()">Reset</button>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    let board = Array(9).fill('');
    let turn = 'X';
    const wins = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function render(){
      boardEl.innerHTML = '';
      board.forEach((v,i)=>{
        const c = document.createElement('div');
        c.className = 'cell';
        c.textContent = v;
        c.addEventListener('click', ()=> play(i));
        boardEl.appendChild(c);
      });
    }
    function play(i){
      if(board[i] || checkWinner()) return;
      board[i] = turn;
      if(checkWinner()){
        setTimeout(()=>alert(turn + ' wins!'), 50);
      } else if(board.every(Boolean)){
        setTimeout(()=>alert('Draw!'), 50);
      } else {
        turn = turn === 'X' ? 'O' : 'X';
      }
      render();
    }
    function checkWinner(){
      return wins.some(w=>{
        const [a,b,c] = w;
        return board[a] && board[a] === board[b] && board[a] === board[c];
      });
    }
    function reset(){ board = Array(9).fill(''); turn='X'; render(); }
    render();
  </script>
</body>
</html>
